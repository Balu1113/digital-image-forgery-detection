services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      FLASK_DEBUG: "false"
    expose:
      - "5000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_DB_PATH: /data/db.sqlite3
      FORGERY_API_URL: http://inference:5000
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - backend_media:/app/media
      - backend_data:/data
    expose:
      - "8000"
    depends_on:
      - inference
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_media:
  backend_data:
